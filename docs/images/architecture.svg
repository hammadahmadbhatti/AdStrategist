<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="AdStrategist architecture: interfaces, orchestration, retrieval tools, RAG, model layer, guardrails, outputs"><rect width="1280" height="900" rx="20" fill="#0b1220"/><text x="40" y="54" font-size="32" fill="#e8ecf1" font-weight="750" text-anchor="start">AdStrategist</text><text x="40" y="82" font-size="15.5" fill="#9aa8bd" font-weight="400" text-anchor="start">Local-first agentic RAG system: one product link in, market research, budget, ad campaigns and a video ad out</text><text x="1240" y="54" font-size="14" fill="#5fcfb8" font-weight="600" text-anchor="end">LangChain · LangGraph · Chroma · Ollama · MCP</text><text x="1240" y="78" font-size="13" fill="#9aa8bd" font-weight="400" text-anchor="end">runs on a MacBook Air M1 with 8 GB</text><rect x="40" y="108" width="1200" height="96" rx="16" fill="#121b2d" stroke="#263550"/><rect x="40" y="108" width="6" height="96" rx="3" fill="#7cb7ff"/><text x="64" y="134" font-size="12" fill="#7cb7ff" font-weight="700" text-anchor="start" letter-spacing="1.4">INTERFACES</text><rect x="64" y="144" width="360" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="78" y="167" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Web interface</text><text x="78" y="187" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">FastAPI, pick steps, platforms and models</text><rect x="442" y="144" width="360" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="456" y="167" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Command line</text><text x="456" y="187" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">run, ask, graph, providers</text><rect x="820" y="144" width="360" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="834" y="167" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">MCP server</text><text x="834" y="187" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">6 tools over stdio for Claude Desktop and agents</text><line x1="640" y1="204" x2="640" y2="225" stroke="#263550" stroke-width="2"/><path d="M634,224 L646,224 L640,232 Z" fill="#263550"/><rect x="40" y="232" width="1200" height="124" rx="16" fill="#121b2d" stroke="#263550"/><rect x="40" y="232" width="6" height="124" rx="3" fill="#a78bfa"/><text x="64" y="258" font-size="12" fill="#a78bfa" font-weight="700" text-anchor="start" letter-spacing="1.4">ORCHESTRATION: TEN STEPS, TWO INTERCHANGEABLE ENGINES</text><rect x="64" y="268" width="548" height="50" rx="11" fill="#0e1626" stroke="#a78bfa" stroke-opacity="0.55"/><text x="78" y="291" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Native engine</text><text x="78" y="311" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">plain Python loop, fewest moving parts</text><rect x="630" y="268" width="586" height="50" rx="11" fill="#0e1626" stroke="#a78bfa" stroke-opacity="0.55"/><text x="644" y="291" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">LangGraph engine</text><text x="644" y="311" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">StateGraph, conditional edges, review-and-revise loop for ad copy</text><text x="640" y="340" font-size="13" fill="#9aa8bd" font-weight="400" text-anchor="middle">brief  →  competitors  →  competitor ads  →  keywords  →  gaps  →  traffic  →  budget  →  campaigns  →  video  →  summary</text><line x1="250" y1="356" x2="250" y2="377" stroke="#263550" stroke-width="2"/><path d="M244,376 L256,376 L250,384 Z" fill="#263550"/><line x1="640" y1="356" x2="640" y2="377" stroke="#263550" stroke-width="2"/><path d="M634,376 L646,376 L640,384 Z" fill="#263550"/><line x1="1030" y1="356" x2="1030" y2="377" stroke="#263550" stroke-width="2"/><path d="M1024,376 L1036,376 L1030,384 Z" fill="#263550"/><rect x="40" y="384" width="386" height="232" rx="16" fill="#121b2d" stroke="#263550"/><rect x="40" y="384" width="386" height="6" rx="3" fill="#5fcfb8"/><text x="60" y="418" font-size="12" fill="#5fcfb8" font-weight="700" text-anchor="start" letter-spacing="1.4">RETRIEVAL TOOLS: WHERE FACTS COME FROM</text><circle cx="66" cy="441" r="3.5" fill="#5fcfb8"/><text x="80" y="446" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Web crawler</text><text x="80" y="462" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">pages, prices, offers, ad tracking tags</text><circle cx="66" cy="475" r="3.5" fill="#5fcfb8"/><text x="80" y="480" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Web search and autocomplete</text><text x="80" y="496" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">competitors, real search phrases</text><circle cx="66" cy="509" r="3.5" fill="#5fcfb8"/><text x="80" y="514" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Keyword Planner CSV</text><text x="80" y="530" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">real volumes and bids</text><circle cx="66" cy="543" r="3.5" fill="#5fcfb8"/><text x="80" y="548" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Ad transparency libraries</text><text x="80" y="564" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">competitors&#x27; live ads</text><circle cx="66" cy="577" r="3.5" fill="#5fcfb8"/><text x="80" y="582" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Vision model</text><text x="80" y="598" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">describes your photos and clips</text><rect x="447" y="384" width="386" height="232" rx="16" fill="#121b2d" stroke="#263550"/><rect x="447" y="384" width="386" height="6" rx="3" fill="#f2c46b"/><text x="467" y="418" font-size="12" fill="#f2c46b" font-weight="700" text-anchor="start" letter-spacing="1.4">RAG: LANGCHAIN AND CHROMA</text><circle cx="473" cy="441" r="3.5" fill="#f2c46b"/><text x="487" y="446" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Split, embed, index</text><text x="487" y="462" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">400-char passages, local embeddings, Chroma</text><circle cx="473" cy="475" r="3.5" fill="#f2c46b"/><text x="487" y="480" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Retrieval for prompts</text><text x="487" y="496" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">steps get the passages that answer them</text><circle cx="473" cy="509" r="3.5" fill="#f2c46b"/><text x="487" y="514" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Evidence for findings</text><text x="487" y="530" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">quote, link and similarity score</text><circle cx="473" cy="543" r="3.5" fill="#f2c46b"/><text x="487" y="548" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Agentic question answering</text><text x="487" y="564" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">retrieve, grade, rewrite, generate, verify</text><circle cx="473" cy="577" r="3.5" fill="#f2c46b"/><text x="487" y="582" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Refusal path</text><text x="487" y="598" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">nothing relevant found: no answer is generated</text><rect x="854" y="384" width="386" height="232" rx="16" fill="#121b2d" stroke="#263550"/><rect x="854" y="384" width="386" height="6" rx="3" fill="#ff9d9d"/><text x="874" y="418" font-size="12" fill="#ff9d9d" font-weight="700" text-anchor="start" letter-spacing="1.4">MODEL LAYER: SWITCHABLE PER ROLE</text><circle cx="880" cy="441" r="3.5" fill="#ff9d9d"/><text x="894" y="446" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Role router</text><text x="894" y="462" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">research, writing and vision roles</text><circle cx="880" cy="475" r="3.5" fill="#ff9d9d"/><text x="894" y="480" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Local models</text><text x="894" y="496" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">Ollama 3B model, MLX</text><circle cx="880" cy="509" r="3.5" fill="#ff9d9d"/><text x="894" y="514" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Paid models, optional</text><text x="894" y="530" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">any OpenAI-compatible API, Claude</text><circle cx="880" cy="543" r="3.5" fill="#ff9d9d"/><text x="894" y="548" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Structured output</text><text x="894" y="564" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">JSON schema, repair, coercion, retry</text><circle cx="880" cy="577" r="3.5" fill="#ff9d9d"/><text x="894" y="582" font-size="14" fill="#e8ecf1" font-weight="600" text-anchor="start">Fallback chain</text><text x="894" y="598" font-size="12" fill="#9aa8bd" font-weight="400" text-anchor="start">paid model, then local model, then rules</text><line x1="250" y1="616" x2="250" y2="637" stroke="#263550" stroke-width="2"/><path d="M244,636 L256,636 L250,644 Z" fill="#263550"/><line x1="640" y1="616" x2="640" y2="637" stroke="#263550" stroke-width="2"/><path d="M634,636 L646,636 L640,644 Z" fill="#263550"/><line x1="1030" y1="616" x2="1030" y2="637" stroke="#263550" stroke-width="2"/><path d="M1024,636 L1036,636 L1030,644 Z" fill="#263550"/><rect x="40" y="644" width="1200" height="96" rx="16" fill="#121b2d" stroke="#263550"/><rect x="40" y="644" width="6" height="96" rx="3" fill="#5fcfb8"/><text x="64" y="670" font-size="12" fill="#5fcfb8" font-weight="700" text-anchor="start" letter-spacing="1.4">GUARDRAILS: DETERMINISTIC CODE BETWEEN THE MODEL AND THE OUTPUT</text><rect x="64" y="680" width="222" height="50" rx="11" fill="#0e1626" stroke="#5fcfb8" stroke-opacity="0.55"/><text x="78" y="703" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Claim check</text><text x="78" y="723" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">is it on the page?</text><rect x="296" y="680" width="222" height="50" rx="11" fill="#0e1626" stroke="#5fcfb8" stroke-opacity="0.55"/><text x="310" y="703" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Figure check</text><text x="310" y="723" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">is the number in the source?</text><rect x="528" y="680" width="222" height="50" rx="11" fill="#0e1626" stroke="#5fcfb8" stroke-opacity="0.55"/><text x="542" y="703" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Schema validation</text><text x="542" y="723" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">shape, repair, retry</text><rect x="760" y="680" width="222" height="50" rx="11" fill="#0e1626" stroke="#5fcfb8" stroke-opacity="0.55"/><text x="774" y="703" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Platform limits</text><text x="774" y="723" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">30 and 90 characters</text><rect x="992" y="680" width="222" height="50" rx="11" fill="#0e1626" stroke="#5fcfb8" stroke-opacity="0.55"/><text x="1006" y="703" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Vision sanitiser</text><text x="1006" y="723" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">drops misread logos</text><line x1="640" y1="740" x2="640" y2="761" stroke="#263550" stroke-width="2"/><path d="M634,760 L646,760 L640,768 Z" fill="#263550"/><rect x="40" y="768" width="1200" height="96" rx="16" fill="#121b2d" stroke="#263550"/><rect x="40" y="768" width="6" height="96" rx="3" fill="#7cb7ff"/><text x="64" y="794" font-size="12" fill="#7cb7ff" font-weight="700" text-anchor="start" letter-spacing="1.4">OUTPUTS</text><rect x="64" y="804" width="222" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="78" y="827" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Research report</text><text x="78" y="847" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">HTML and Markdown</text><rect x="296" y="804" width="222" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="310" y="827" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Campaign files</text><text x="310" y="847" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">Google, Meta, TikTok</text><rect x="528" y="804" width="222" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="542" y="827" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Video ad</text><text x="542" y="847" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">9:16 MP4 from your clips</text><rect x="760" y="804" width="222" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="774" y="827" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Cited answers</text><text x="774" y="847" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">to your questions</text><rect x="992" y="804" width="222" height="50" rx="11" fill="#0e1626" stroke="#7cb7ff" stroke-opacity="0.55"/><text x="1006" y="827" font-size="14.5" fill="#e8ecf1" font-weight="650" text-anchor="start">Run log</text><text x="1006" y="847" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="start">tokens, rejected claims</text><text x="640" y="888" font-size="12.5" fill="#9aa8bd" font-weight="400" text-anchor="middle">106 offline tests · models never supply numbers · every generated line is checked against its source</text></svg>