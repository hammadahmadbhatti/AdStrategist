[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adstrategist"
version = "0.1.0"
description = "Local-first marketing research and ad campaign pipeline with a switchable LLM layer"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.1",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
rag = [
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-ollama>=1.0",
    "langchain-chroma>=1.0",
    "langgraph>=1.0",
]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
adstrategist = "adstrategist.cli:main"

[tool.setuptools.packages.find]
include = ["adstrategist*"]

[tool.setuptools.package-data]
adstrategist = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
